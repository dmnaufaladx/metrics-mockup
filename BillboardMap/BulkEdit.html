    <div class="main">
        <div class="main_container__upload_content">
          <section
            id="picking"

            <input

                <div class="upload-here">

                      <p>tips you can only drop single file here</p>
                    </div>
                  </div>
                </div>
              </div></label
            >
            <div class="uploaded-file" id="selected" hidden>
              <div class="list-file">
                <div class="header">FILE UPLOADED</div>
                <div class="file-csv">
                  <div class="number">1</div>
                  <div class="file-name" id="filename"></div>
                  <button
                    type="button"
                    class="icon-wrapper"
                    id="remove"
                    aria-label="Remove selected file"
                  >
                    ×
                  </button>
                </div>
                <div class="button-download">
                  <button
                    type="button"
                    class="primary converter-trigger"
                    id="upload"
                  >
                    Upload Billboard Spreadsheet File
                  </button>
                </div>
              </div>
            </div>
          </section>
          <section
            id="progress"
            class="main_container__upload_content__progressing-view"
            hidden
            role="status"
            aria-live="polite"
          >
            <div class="spinner" aria-hidden="true"></div>
            <p class="progress-text">Processing spreadsheet…</p>
          </section>
          <p class="message" id="error" role="alert"></p>
        </div>
      </div>
    </main>
    <dialog id="discard-dialog">

      <div class="dialog-actions">

        ><button id="discard" class="primary">Discard</button>
      </div>
    </dialog>
    <script>
      "use strict";
      // Migrate legacy preview codes while preserving record IDs and other edits.
      (() => {
        const key = "metrics-preview-placement-records-v1";
        const normalize = (value) =>
          String(value || "")
            .toUpperCase()
            .replace(/^SOV-/, "")
            .replace(/-/g, "");
        try {
          const rows = JSON.parse(sessionStorage.getItem(key) || "null");
          const aliases = new Map();
          if (Array.isArray(rows)) {
            const cities = {
              Jakarta: "JKT",
              Tangerang: "TGR",
              Bekasi: "BKS",
              Depok: "DPK",
              Bogor: "BGR",
              Bandung: "BDG",
              Surabaya: "SBY",
              Aceh: "ACH",
              Ambon: "AMB",
            };
            const used = new Set(
              rows.map((r) => normalize(r["Placement Code"])),
            );
            rows.forEach((row) => {
              const old = row["Placement Code"];
              if (typeof old !== "string") return;
              let code = normalize(old);
              if (/^BULKDEMO/.test(code)) {
                let number = Number(row.id) || 1;
                const prefix = cities[row.City] || "JKT";
                do {
                  code = prefix + String(number++).padStart(3, "0");
                } while (used.has(code));
              }
              used.add(code);
              aliases.set(old, code);
              row["Placement Code"] = code;
              row["SOV Code"] = code;
            });
            sessionStorage.setItem(key, JSON.stringify(rows));
          }
          const queueKey = "metrics-preview-photo-queue-v1";
          const queue = JSON.parse(sessionStorage.getItem(queueKey) || "null");
          if (Array.isArray(queue)) {
            queue.forEach((row) => {
              if (typeof row.code === "string")
                row.code = aliases.get(row.code) || normalize(row.code);
            });
            sessionStorage.setItem(queueKey, JSON.stringify(queue));
          }
        } catch {}
      })();

        storageKey = "metrics-preview-placement-records-v1",
        $ = (id) => document.getElementById(id);
      let file = null,
        busy = false;
      function showError(text) {
        $("error").textContent = text;
      }
      function render() {
        $("selected").hidden = !file;
        $("filename").textContent = file?.name || "";
      }
      function select(files) {
        if (busy) return;
        showError("");
        if (files.length !== 1) {
          if (files.length) showError("Please select a single xlsx file.");
          return;
        }
        const next = files[0];
        if (!/\.xlsx$/i.test(next.name)) {
          showError("Only accept xlsx file.");
          $("file").value = "";
          return;
        }
        if (!next.size) {
          showError(
            "The selected file is empty. Please choose a valid xlsx file.",
          );
          $("file").value = "";
          return;
        }
        file = next;
        render();
      }
      $("file").onchange = () => select([...$("file").files]);
      $("remove").onclick = () => {
        file = null;
        $("file").value = "";
        showError("");
        render();
      };
      $("drop").onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          $("file").click();
        }
      };
      for (const type of ["dragover", "dragleave", "drop"])
        $("drop").addEventListener(type, (e) => {
          e.preventDefault();
          $("drop-section").classList.toggle(
            "cursor-over",
            type === "dragover",
          );
          $("drop-section").classList.toggle(
            "cursor-leave",
            type !== "dragover",
          );
          if (type === "drop") select([...e.dataTransfer.files]);
        });
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", (e) => e.preventDefault());
      function loading(value) {
        busy = value;
        $("picking").hidden = value;
        $("progress").hidden = !value;
        $("upload").disabled = value;
        $("file").disabled = value;
        $("back").setAttribute("aria-disabled", String(value));
      }
      $("upload").onclick = async () => {
        if (busy) return;
        if (!file) {
          showError("Pick an xlsx file first!");
          return;
        }
        showError("");
        loading(true);
        try {
          const bytes = new Uint8Array(await file.slice(0, 4).arrayBuffer());
          if (
            bytes[0] !== 80 ||
            bytes[1] !== 75 ||
            bytes[2] !== 3 ||
            bytes[3] !== 4
          )
            throw Error(
              "Please check whether the xlsx file is valid. Expected an XLSX ZIP container.",
            );
          await new Promise((r) => setTimeout(r, 700));
          let records = seed;
          const stored = sessionStorage.getItem(storageKey);
          if (stored !== null) {
            const parsed = JSON.parse(stored);
            if (
              !Array.isArray(parsed) ||
              !parsed.every(
                (r) =>
                  r &&
                  Number.isInteger(r.id) &&
                  typeof r["Placement Code"] === "string",
              )
            )
              throw Error(
                "Saved preview data could not be read. Existing data has been preserved.",
              );
            records = parsed;
          }
          const targetCodes = seed.slice(0, 2).map((r) => r["Placement Code"]);
          const missing = targetCodes.filter(
            (code) => !records.some((r) => r["Placement Code"] === code),
          );
          const updated = records.map((r) =>
            targetCodes.includes(r["Placement Code"])
              ? {
                  ...r,
                  Note: "Updated by Bulk Edit preview",
                  "Last Updated": new Date()
                    .toISOString()
                    .slice(0, 16)
                    .replace("T", " "),
                }
              : r,
          );
          const count = targetCodes.length - missing.length;
          if (count)
            sessionStorage.setItem(storageKey, JSON.stringify(updated));
          file = null;
          const result = new URLSearchParams({
            bulkEdited: String(count),
            missing: missing.join(", "),
          });
          location.href = "PlacementList.html?" + result;
        } catch (e) {
          showError(
            e.name === "QuotaExceededError" || e.name === "SecurityError"
              ? "Local storage is unavailable or full. No placements were updated."
              : e.message || "Could not process this file. Please try again.",
          );
          loading(false);
        }
      };
      $("back").onclick = (e) => {
        if (busy) {
          e.preventDefault();
          return;
        }
        if (file) {
          e.preventDefault();
          $("discard-dialog").showModal();
        }
      };
      $("keep").onclick = () => $("discard-dialog").close();
      $("discard").onclick = () => {
        file = null;
        location.href = "PlacementList.html";
      };
      window.addEventListener("beforeunload", (e) => {
        if (file) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      render();
    </script>
