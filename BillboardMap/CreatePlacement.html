      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 16px;

      .field {
        position: relative;
        min-width: 0;

      .field:first-child,
      .field.note {
        grid-column: 1/-1;

        width: 100%;

        padding: 25px 14px 10px;
        min-height: 58px;
      }
      .field textarea {
        resize: vertical;
        min-height: 115px;

      .field input:disabled,

        background: #f5f5fa;
        color: #68686c;

      "use strict";
      // Migrate legacy preview codes while preserving record IDs and other edits.
      (() => {
        const key = "metrics-preview-placement-records-v1";
        const normalize = (value) =>
          String(value || "")
            .toUpperCase()
            .replace(/^SOV-/, "")
            .replace(/-/g, "");
        try {
          const rows = JSON.parse(sessionStorage.getItem(key) || "null");
          const aliases = new Map();
          if (Array.isArray(rows)) {
            const cities = {
              Jakarta: "JKT",
              Tangerang: "TGR",
              Bekasi: "BKS",
              Depok: "DPK",
              Bogor: "BGR",
              Bandung: "BDG",
              Surabaya: "SBY",
              Aceh: "ACH",
              Ambon: "AMB",
            };
            const used = new Set(
              rows.map((r) => normalize(r["Placement Code"])),
            );
            rows.forEach((row) => {
              const old = row["Placement Code"];
              if (typeof old !== "string") return;
              let code = normalize(old);
              if (/^BULKDEMO/.test(code)) {
                let number = Number(row.id) || 1;
                const prefix = cities[row.City] || "JKT";
                do {
                  code = prefix + String(number++).padStart(3, "0");
                } while (used.has(code));
              }
              used.add(code);
              aliases.set(old, code);
              row["Placement Code"] = code;
              row["SOV Code"] = code;
            });
            sessionStorage.setItem(key, JSON.stringify(rows));
          }
          const queueKey = "metrics-preview-photo-queue-v1";
          const queue = JSON.parse(sessionStorage.getItem(queueKey) || "null");
          if (Array.isArray(queue)) {
            queue.forEach((row) => {
              if (typeof row.code === "string")
                row.code = aliases.get(row.code) || normalize(row.code);
            });
            sessionStorage.setItem(queueKey, JSON.stringify(queue));
          }
        } catch {}

          {

            "Is it on Gmaps?": "Yes",
            "Road Type": "Main Road",
            "Profile Audience": "Commuter",
            "Profile Job": "Office Worker",
            Surrounding: "Residential",
            View: "Clear",
            Traffic: 110000,
            "Width (m)": 10,
            "Height (m)": 5,
            Unit: 1,
            Orientation: "Landscape",
            Lighting: "Frontlit",

            Resolution: "1920 × 1080",
            "Price Capital 1M (IDR)": 66500000,

            "Price 1M (IDR)": 95000000,
            "Price 3M (IDR)": 285000000,
            "Price 6M (IDR)": 570000000,
            "Price 12M (IDR)": 1140000000,
            Note: "Sample placement",
            "Already Updated?": "Yes",
            "Updated Date": "2026-09-01",
            "Price Updated Date": "2026-09-01",
            "Availability Date": "Available",
            "Price Update Status": "Updated",

            "Nielsen City": "Jakarta",
            "CAP Priority": "Normal",
            "Last Updated": "2026-09-01 10:00",
            id: 8,
          },
        ],
      };
      const $ = (id) => document.getElementById(id),
        storageKey = "metrics-preview-placement-records-v1";
      let records = seed.records;
      try {
        const stored = JSON.parse(sessionStorage.getItem(storageKey));
        if (
          Array.isArray(stored) &&
          stored.every(
            (r) =>
              r &&
              Number.isInteger(r.id) &&
              typeof r["Placement Code"] === "string",
          )
        )
          records = stored;
      } catch {}
      const common = new Map(),
        near = new Map(),
        placements = [],
        urls = new Set();
      let dirty = false,
        busy = false,
        counter = 0,
        checkVersion = 0,
        confirmAction = null;
      function error(message) {
        $("form-error").textContent = message;
      }
      function markDirty() {
        dirty = true;
        error("");
      }
      function field(def, prefix, parent) {
        const wrap = document.createElement("div");
        wrap.className =
          "field" +
          (def.type === "textarea"
            ? " note"
            : def.label === "Surrounding"
              ? " wide"
              : "");
        const label = document.createElement("label"),
          input = document.createElement(
            def.select
              ? "select"
              : def.type === "textarea"
                ? "textarea"
                : "input",
          );
        label.textContent = def.label;
        input.id = prefix + "-" + def.model.replace(/\W/g, "-");
        label.htmlFor = input.id;
        input.name = def.key;
        if (def.select) {
          input.add(new Option("Select " + def.label, ""));
          (def.options || []).forEach((v) => input.add(new Option(v, v)));
        } else if (def.type !== "textarea") input.type = def.type || "text";
        if (
          [
            "Code",
            "City",
            "Latitude",
            "Longitude",
            "Media Type",
            "Width",
            "Height",
          ].includes(def.label)
        )
          input.required = true;
        if (input.type === "number") {
          input.step = "any";
          input.min =
            def.label === "Latitude"
              ? -90
              : def.label === "Longitude"
                ? -180
                : ["Width", "Height"].includes(def.label)
                  ? 0.01
                  : 0;
          if (def.label === "Latitude") input.max = 90;
          if (def.label === "Longitude") input.max = 180;
          if (def.label.includes("Discount")) input.max = 100;
        }
        if (def.label === "Operational Hours")
          input.placeholder = "00.00 - 00.00";
        input.addEventListener("input", () => {
          input.setCustomValidity("");
          markDirty();
        });
        wrap.append(label, input);
        parent.append(wrap);
        return input;
      }
      seed.common.forEach((def) =>
        common.set(def.key, field(def, "main", $("common-fields"))),
      );
      function mediaFields() {
        const visible =
          common.get("Media Type").value.toLowerCase() === "videotron";
        for (const key of [
          "Spot /day",
          "Client Slot",
          "Resolution",
          "Duration /slot",
        ]) {
          const c = common.get(key);
          c.parentElement.hidden = !visible;
          c.disabled = !visible;
        }
      }
      common.get("Media Type").addEventListener("change", mediaFields);
      mediaFields();
      ["City", "Latitude", "Longitude"].forEach((key) => {
        const def = seed.common.find((f) => f.key === key),
          input = field(def, "near", $("nearby-fields"));
        near.set(key, input);
        const sync = (from, to) => {
          to.value = from.value;
          invalidateNearby();
        };
        input.addEventListener("input", () => sync(input, common.get(key)));
        common
          .get(key)
          .addEventListener("input", () => sync(common.get(key), input));
      });
      const checks = [
        ["Ada di Gmaps?", "Is it on Gmaps?"],
        ["Traffic Updated?", "Traffic Updated?"],
        ["Price Updated?", "Already Updated?"],
      ];
      checks.forEach(([label, key], i) => {
        const wrap = document.createElement("label"),
          input = document.createElement("input");
        input.type = "checkbox";
        input.id = "check-" + i;
        input.addEventListener("change", markDirty);
        wrap.append(input, document.createTextNode(label));
        $("checks").append(wrap);
      });
      function invalidateNearby() {
        checkVersion++;
        $("nearby-results").replaceChildren();
        $("existing-code").replaceChildren(new Option("Select Code", ""));
        $("check").disabled = false;
        $("check").textContent = "Check Coordinate";
      }
      function mode() {
        return document.querySelector("[name=mode]:checked").value;
      }
      document.querySelectorAll("[name=mode]").forEach((input) =>
        input.addEventListener("change", () => {
          $("existing-box").hidden = mode() !== "Existing";
          $("existing-code").required = mode() === "Existing";
          markDirty();
        }),
      );
      $("existing-code").addEventListener("change", markDirty);
      function distance(row, lat, lon) {
        const [a, b] = String(row.Coordinate || "")
          .split(",")
          .map(Number);
        if (!Number.isFinite(a) || !Number.isFinite(b)) return Infinity;
        const rad = Math.PI / 180,
          x =
            Math.sin(((a - lat) * rad) / 2) ** 2 +
            Math.cos(lat * rad) *
              Math.cos(a * rad) *
              Math.sin(((b - lon) * rad) / 2) ** 2;
        return (
          6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(Math.max(0, 1 - x)))
        );
      }
      $("check").onclick = async () => {
        if (![...near.values()].every((c) => c.reportValidity())) return;
        const version = ++checkVersion;
        $("check").disabled = true;
        $("check").textContent = "Checking…";
        await new Promise((r) => setTimeout(r, 350));
        if (version !== checkVersion) return;
        const rows = records.filter(
            (r) =>
              r.City === near.get("City").value &&
              distance(
                r,
                +near.get("Latitude").value,
                +near.get("Longitude").value,
              ) <= 5,
          ),
          groups = new Map();
        rows.forEach((r) => {
          const code = r["SOV Code"] || r["Placement Code"];
          if (!groups.has(code)) groups.set(code, []);
          groups.get(code).push(r);
        });
        const result = $("nearby-results");
        result.replaceChildren();
        $("existing-code").replaceChildren(new Option("Select Code", ""));
        const heading = document.createElement("p");
        heading.className = "nearby-info";
        heading.textContent = groups.size
          ? "SOV Terdekat"
          : "Tidak Ditemukan Nearby Placement";
        result.append(heading);
        for (const [code, items] of groups) {
          $("existing-code").add(new Option(code, code));
          const box = document.createElement("div"),
            title = document.createElement("p"),
            photos = document.createElement("div");
          box.className = "nearby-placement";
          photos.className = "nearby-photos";
          title.textContent = code;
          for (const row of items) {
            const figure = document.createElement("figure"),
              caption = document.createElement("figcaption"),
              img = document.createElement("img");
            caption.textContent = row.Side || "-";
            img.src = "../assets/img/bb-na-placeholder.png";
            img.alt = "Sample billboard";
            figure.append(caption, img);
            photos.append(figure);
          }
          box.append(title, photos);
          result.append(box);
        }
        const note = document.createElement("p");
        note.className = "nearby-info";
        note.textContent = groups.size
          ? "Harap cek manual di SOV untuk mengecek apakah sudah terdaftar di SOV"
          : "";
        result.append(note);
        $("check").disabled = false;
        $("check").textContent = "Check Coordinate";
      };
      function addPhoto(parent, label, prefix) {
        const box = document.createElement("div");
        box.className = "picture-box";
        const top = document.createElement("div");
        top.className = "photo-top";
        const title = document.createElement("label"),
          input = document.createElement("input"),
          img = document.createElement("img"),
          remove = document.createElement("button"),
          hint = document.createElement("p");
        input.type = "file";
        input.accept = "image/jpeg";
        input.id = prefix;
        input.hidden = true;
        const open = document.createElement("label");
        open.htmlFor = prefix;
        open.className = "open-file";
        open.textContent = "Open";
        open.tabIndex = 0;
        open.setAttribute("role", "button");
        open.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            input.click();
          }
        };
        title.htmlFor = prefix;
        title.textContent = label;
        hint.className = "muted";
        hint.textContent = "File JPEG only";
        img.hidden = true;
        img.alt = label + " preview";
        remove.type = "button";
        remove.textContent = "Remove";
        remove.hidden = true;
        top.append(title, img, remove);
        box.append(top, hint, input, open);
        parent.append(box);
        let version = 0,
          url = "";
        remove.onclick = () => {
          version++;
          if (url) {
            URL.revokeObjectURL(url);
            urls.delete(url);
          }
          url = "";
          input.value = "";
          img.removeAttribute("src");
          img.hidden = remove.hidden = true;
          markDirty();
        };
        input.onchange = async () => {
          const file = input.files[0],
            current = ++version;
          if (!file) return;
          if (file.type !== "image/jpeg") {
            input.value = "";
            error("Please select a JPEG image file.");
            return;
          }
          const next = URL.createObjectURL(file),
            preview = new Image();
          try {
            preview.src = next;
            await preview.decode();
            if (current !== version || !box.isConnected) {
              URL.revokeObjectURL(next);
              return;
            }
            if (url) {
              URL.revokeObjectURL(url);
              urls.delete(url);
            }
            url = next;
            urls.add(next);
            img.src = next;
            img.hidden = remove.hidden = false;
            markDirty();
          } catch {
            URL.revokeObjectURL(next);
            input.value = "";
            error("The JPEG image could not be read.");
          }
        };
        return () => {
          version++;
          if (url) {
            URL.revokeObjectURL(url);
            urls.delete(url);
          }
        };
      }
      $("add").onclick = () => {
        const n = ++counter,
          box = document.createElement("fieldset"),
          legend = document.createElement("legend"),
          fields = document.createElement("div"),
          pictures = document.createElement("div"),
          controls = new Map();
        box.className = "placement-input";
        legend.textContent = "Placement " + (placements.length + 1);
        fields.className = "fields";
        pictures.className = "pictures";
        box.append(legend, fields, pictures);
        seed.sides.forEach((def) =>
          controls.set(def.key, field(def, "placement-" + n, fields)),
        );
        const dispose = [
          addPhoto(pictures, "Picture", "picture-" + n),
          addPhoto(pictures, "Map Image", "map-image-" + n),
        ];
        $("placements").append(box);
        placements.push({ box, controls, dispose });
        markDirty();
      };
      function ask(title, message, action) {
        confirmAction = action;
        $("confirm-title").textContent = title;
        $("confirm-description").textContent = message;
        $("confirm-dialog").showModal();
      }
      $("keep").onclick = () => {
        $("confirm-dialog").close();
        confirmAction = null;
      };
      $("confirm").onclick = () => {
        $("confirm-dialog").close();
        const action = confirmAction;
        confirmAction = null;
        action?.();
      };
      $("remove").onclick = () => {
        if (!placements.length) return;
        ask(
          "Remove placement?",
          "Remove the last placement and its unsaved images?",
          () => {
            const item = placements.pop();
            item.dispose.forEach((fn) => fn());
            item.box.remove();
            markDirty();
          },
        );
      };
      $("back").onclick = (e) => {
        if (busy) {
          e.preventDefault();
          return;
        }
        if (dirty) {
          e.preventDefault();
          ask(
            "Discard changes?",
            "Your unsaved placement data will be discarded.",
            () => {
              dirty = false;
              location.href = "PlacementList.html";
            },
          );
        }
      };
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      function values(defs, controls) {
        return Object.fromEntries(
          defs.map((f) => {
            const c = controls.get(f.key);
            if (c.disabled) return [f.key, ""];
            return [
              f.key,
              c.type === "number" && c.value !== ""
                ? Number(c.value)
                : c.value.trim(),
            ];
          }),
        );
      }
      $("placement-form").onsubmit = async (e) => {
        e.preventDefault();
        if (busy) return;
        error("");
        if (!placements.length) {
          error(
            "Please add minimum one placement, use Add Placement to add placement data.",
          );
          return;
        }
        const code = common.get("Placement Code").value.trim().toUpperCase();
        if (!/^[A-Z]{2,4}\d+[A-Z]?$/.test(code)) {
          error(
            "Use a city abbreviation followed by a number, for example JKT001 or JKT001A.",
          );
          return;
        }
        for (const item of placements) {
          const c = item.controls.get("Operational Hour"),
            v = c.value.trim(),
            m = v.match(
              /^(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})$/,
            );
          if (
            v &&
            (!m ||
              [1, 3].some(
                (i) =>
                  +m[i] > 24 ||
                  +m[i + 1] > 59 ||
                  (+m[i] === 24 && +m[i + 1] > 0),
              ))
          ) {
            c.setCustomValidity(
              "Use HH.MM - HH.MM, for example 10.00 - 18.00.",
            );
            c.reportValidity();
            return;
          }
        }
        let latest = records;
        try {
          const data = JSON.parse(sessionStorage.getItem(storageKey));
          if (
            Array.isArray(data) &&
            data.every(
              (r) =>
                r &&
                Number.isInteger(r.id) &&
                typeof r["Placement Code"] === "string",
            )
          )
            latest = data;
        } catch {}
        const shared = values(seed.common, common),
          maxId = Math.max(0, ...latest.map((r) => r.id));
        const added = placements.map((item, i) => ({
          ...Object.fromEntries(
            Object.keys(seed.records[0]).map((k) => [k, ""]),
          ),
          ...shared,
          ...values(seed.sides, item.controls),
          id: maxId + i + 1,
          "Placement Code": code.replace(/\d+(?=[A-Z]?$)/, (digits) =>
            String(Number(digits) + i).padStart(digits.length, "0"),
          ),
          "SOV Code": code.replace(/\d+(?=[A-Z]?$)/, (digits) =>
            String(Number(digits) + i).padStart(digits.length, "0"),
          ),
          Coordinate: shared.Latitude + ", " + shared.Longitude,
          "Last Updated": new Date()
            .toISOString()
            .slice(0, 16)
            .replace("T", " "),
        }));
        if (
          added.some((r) =>
            latest.some(
              (old) =>
                old["Placement Code"].toLowerCase() ===
                r["Placement Code"].toLowerCase(),
            ),
          )
        ) {
          error("Placement codes must be unique. Choose another Code.");
          return;
        }
        for (const row of added)
          checks.forEach(
            ([, key], i) => (row[key] = $("check-" + i).checked ? "Yes" : "No"),
          );
        busy = true;
        $("editable").disabled = true;
        $("save").textContent = "Saving…";
        await new Promise((r) => setTimeout(r, 400));
        try {
          sessionStorage.setItem(
            storageKey,
            JSON.stringify([...latest, ...added]),
          );
          dirty = false;
          location.href = "PlacementList.html";
        } catch {
          error(
            "Local storage is unavailable or full. Your form has been preserved; please try again.",
          );
          busy = false;
          $("editable").disabled = false;
          $("save").textContent = "Save Placement";
        }
      };
