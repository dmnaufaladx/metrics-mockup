      /* Source: apps/frontend/src/views/Login/index.scss */
      .login__wrapper {
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .login__wrapper .left-section {
        height: 100%;
        width: 50%;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }
      .login__wrapper .left-section img {
        width: 197px;
        height: 47px;
        margin: 45% auto;
      }
      .login__wrapper .right-section {
        max-width: 528px;
        margin: 0 auto;
      }
      .login__wrapper .right-section__header {
        margin-bottom: 48px;
      }
      .login__wrapper .right-section__header hr {
        height: 4px;
        width: 37px;
        background: #ff2d55;
        border: 1px solid #ff2d55;
        max-width: 100px;
        margin: 24px 0;
      }
      .login__wrapper .right-section__header .description label {
        line-height: 2;
        letter-spacing: 1px;
      }
      .login__wrapper .right-section__content .form-login__row {
        width: 100%;
        margin-bottom: 16px;
      }
      .login__wrapper .right-section__content .form-login__row__form-group {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      .login__wrapper
        .right-section__content
        .form-login__row__form-group
        label {
        font-size: 14px;
        color: #262626;
        line-height: 18px;
        margin-bottom: 8px;
        font-weight: 700;
        line-height: 1.38;
        letter-spacing: 1px;
      }
      .login__wrapper
        .right-section__content
        .form-login__row__form-group
        .input,
      .login__wrapper
        .right-section__content
        .form-login__row__form-group
        .message {
        font-size: 14px;
        padding: 16px;
        border: 1px solid #d5d5da;
        border-radius: 4px;
        -webkit-border-radius: 4px;
        -moz-border-radius: 4px;
      }
      .login__wrapper
        .right-section__content
        .form-login__row__form-group
        .message {
        resize: none;
      }
      .login__wrapper
        .right-section__content
        .form-login__row__form-group.password {
        position: relative;
      }
      .login__wrapper
        .right-section__content
        .form-login__row__form-group.password
        .icon {
        position: absolute;
        right: 16px;
        top: 44px;
        cursor: pointer;
      }
      .login__wrapper .right-section__content .form-login__action {
        display: flex;
        justify-content: flex-end;
        width: 100%;
        margin-top: 8px;
      }
      .login__wrapper .right-section__content .form-login__action .submit-btn {
        display: flex;
      }

      @media (max-width: 1140px) {
        .login__wrapper {
          display: unset;
        }
        .login__wrapper .left-section {
          height: 380px;
          position: absolute;
          width: 100%;
        }
        .login__wrapper .left-section img {
          width: 197px;
          height: 47px;
          margin: 15% auto;
        }
        .login__wrapper .right-section {
          max-width: 672px;
          position: relative;
          height: 542px;
          margin: 32% auto;
          border-radius: 8px;
          box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.16);
          background-color: #ffffff;
          padding: 48px;
        }
      }
      @media (max-width: 767px) {
        .login__wrapper {
          display: unset;
          overflow: scroll;
        }
        .login__wrapper .right-section {
          padding: 48px 16px;
          margin: 144px auto;
        }
        .login__wrapper .right-section__content .form-login__action {
          margin-top: 8px;
        }
        .login__wrapper
          .right-section__content
          .form-login__action
          .submit-btn {
          display: flex;
          width: 100%;
          justify-content: center;
        }

      /* Static adaptation: accessible forms and local demo feedback. */
      html {
        color: #262626;
        background: #fff;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid #007aff !important;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .skip-link {
        position: absolute;
        z-index: 10002;
        top: 8px;
        left: 8px;
        padding: 12px;
        background: white;
        transform: translateY(-160%);
      }
      .skip-link:focus {
        transform: none;
      }
      .input,
      .message,
      select {
        color: #262626;
        background: #fff;
        min-width: 0;
      }
      .input::placeholder,
      .message::placeholder {
        color: #767676;
        opacity: 1;
      }
      .field-error {
        color: #b6203e;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 6px;
      }
      input[aria-invalid="true"],
      textarea[aria-invalid="true"] {
        border-color: #b6203e !important;
      }
      .form-demo-note {
        font-size: 13px;
        line-height: 1.6;
        color: #68686c;
        margin-top: 16px;
      }
      .submit-btn {
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        min-width: 120px;
      }
      .submit-btn:disabled {
        cursor: wait;
      }
      .sk-circle {
        display: inline-block;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .notification {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10001;
        max-width: calc(100% - 32px);
      }
      .notification .alert {
        width: 320px;
        max-width: 100%;
        padding-right: 44px;
        margin: 0;
        cursor: default;
      }
      .notification .title {
        font-size: 16px;
      }
      .notification .content-alert {
        line-height: 1.5;
      }
      .notification .notice-close {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 32px;
        height: 32px;
        border-radius: 4px;
        display: grid;
        place-items: center;
      }
      .notification .notice-close i {
        position: static;
        font-size: 12px;
      }
      .notification .alert.success .title,
      .notification .alert.success .content-alert {
        color: #19662b;
      }
      .notification .alert.danger .title,
      .notification .alert.danger .content-alert {
        color: #95241e;
      }
      @media (max-width: 767px) {
        input.input,
        textarea.message,
        select {
          font-size: 16px !important;
        }
        .notification {
          top: 8px;
          right: 16px;
          left: 16px;
        }
        .notification .alert {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
        .sk-child:first-child:before {
          transform: scale(1);
        }
      }

      main.login {
        padding: 0;
        min-height: 100vh;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .login__wrapper {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        height: auto;
        align-items: stretch;
      }
      .login__wrapper .left-section {
        flex-shrink: 0;
        height: auto;
        min-height: 100vh;
        min-height: 100svh;
      }
      .login__wrapper .left-section a {
        display: block;
      }
      .login__wrapper .right-section {
        width: calc(50% - 80px);
        align-self: center;
        padding: 48px 0;
      }
      .login__wrapper .right-section__header .description p {
        line-height: 2;
        letter-spacing: 1px;
      }
      .login__wrapper .right-section__header h1 {
        font-size: 32px;
      }
      .login__wrapper
        .right-section__content
        .form-login__row__form-group.password
        .icon {
        top: 31px;
        right: 6px;
        width: 44px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 4px;
      }
      #password {
        padding-right: 54px;
      }
      .demo-account {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #e5e5ea;
        font-size: 13px;
        line-height: 1.65;
        color: #68686c;
        overflow-wrap: anywhere;
      }
      .demo-account > p:first-child {
        color: #262626;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .demo-account .form-demo-note {
        margin-top: 8px;
      }
      #fill-demo {
        margin-top: 8px;
        padding: 6px 0;
        color: #c92245;
        text-decoration: underline;
        font-size: 13px;
      }
      #fill-demo:disabled {
        color: #68686c;
        cursor: wait;
      }
      .form-status {
        color: #19662b;
        font-size: 14px;
        line-height: 1.5;
        margin-top: 16px;
      }
      .form-status:empty {
        display: none;
      }
      @media (max-width: 1140px) {
        .login__wrapper {
          display: flow-root;
          padding: 0 24px 48px;
        }
        .login__wrapper .left-section {
          position: absolute;
          top: 0;
          left: 0;
          min-height: 0;
          height: 380px;
          width: 100%;
        }
        .login__wrapper .left-section img {
          margin: 92px auto 0;
        }
        .login__wrapper .right-section {
          width: 100%;
          max-width: 672px;
          height: auto;
          min-height: 542px;
          margin: 240px auto 0;
          padding: 48px;
        }
      }
      @media (max-width: 767px) {
        .login__wrapper {
          overflow: visible;
          padding: 0 16px 40px;
        }
        .login__wrapper .left-section img {
          margin: 52px auto 0;
        }
        .login__wrapper .right-section {
          margin: 144px auto 0;
          padding: 40px 16px;
        }
        .login__wrapper .right-section__header {
          margin-bottom: 32px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#login-form">Skip to login form</a>
    <main class="login">
      <div class="login__wrapper">
        <div
          class="left-section"
          style="
            background-image: url(&quot;assets/img/metrics-homepage/rectangle@2x.png&quot;);
          "
        >
          <a href="index.html"
            ><img
              src="assets/img/adx-matrix-logo-new.png"
              alt="Metrics by ADX — Home"
          /></a>
        </div>
        <section class="right-section" aria-labelledby="login-title">
          <div class="right-section__header">
            <div class="title"><h1 id="login-title">Login</h1></div>
            <hr />
            <div class="description">
              <p class="base-font">
                Please Login first before continue using amazing tools from
                Metrics by Adx
              </p>
            </div>
          </div>
          <div class="right-section__content">
            <form
              id="login-form"
              method="post"
              action="Login.html"
              novalidate
              aria-label="Login"
              aria-busy="false"
            >
              <fieldset>
                <div class="form-login__row">
                  <div class="form-login__row__form-group">
                    <label for="email">Email Address</label
                    ><input
                      id="email"
                      name="email"
                      type="email"
                      class="input"
                      data-label="email address"
                      aria-describedby="email-error"
                      placeholder="Type valid email address here"
                      autocomplete="username"
                      pattern="[^@]+@[^@]+\.[a-zA-Z]{2,6}"
                      required
                    />
                    <p class="field-error" id="email-error" hidden></p>
                  </div>
                </div>
                <div class="form-login__row">
                  <div class="form-login__row__form-group password">
                    <label for="password">Password</label
                    ><input
                      id="password"
                      name="password"
                      type="password"
                      class="input"
                      data-label="password"
                      aria-describedby="password-error"
                      placeholder="Type your Password here"
                      autocomplete="current-password"
                      minlength="8"
                      maxlength="20"
                      required
                    />
                    <p class="field-error" id="password-error" hidden></p>
                    <button
                      type="button"
                      class="icon password-toggle"
                      aria-label="Show password"
                      aria-pressed="false"
                      aria-controls="password"
                    >
                      <i class="icon-eye-blocked" aria-hidden="true"></i>
                    </button>
                  </div>
                </div>
                <div class="form-login__action">
                  <button type="submit" class="submit-btn btn-primary">
                    <span class="btn-label base-font">Login</span
                    ><span class="sk-circle" aria-hidden="true" hidden
                      ><span class="sk-circle1 sk-child"></span
                      ><span class="sk-circle2 sk-child"></span
                      ><span class="sk-circle3 sk-child"></span
                      ><span class="sk-circle4 sk-child"></span
                      ><span class="sk-circle5 sk-child"></span
                      ><span class="sk-circle6 sk-child"></span
                      ><span class="sk-circle7 sk-child"></span
                      ><span class="sk-circle8 sk-child"></span
                      ><span class="sk-circle9 sk-child"></span
                      ><span class="sk-circle10 sk-child"></span
                      ><span class="sk-circle11 sk-child"></span
                      ><span class="sk-circle12 sk-child"></span
                    ></span>
                  </button>
                </div>
              </fieldset>
              <p
                id="form-status"
                class="form-status"
                role="status"
                aria-live="polite"
              ></p>
            </form>
          </div>
          <!-- <aside class="demo-account" aria-label="Demo account"><p>Try the demo account</p><p><span>Email:</span> <span class="demo-email">demo@metrics.test</span><br><span>Password:</span> <span class="demo-password">Metrics123!</span></p><button type="button" id="fill-demo">Use demo account</button><p class="form-demo-note">Demo preview. A successful login opens Home.</p></aside> -->
        </section>
      </div>
    </main>
    <aside class="notification" aria-label="Notification" hidden>
      <div class="alert">
        <div role="status" aria-live="polite" aria-atomic="true">
          <h2 class="title base-font" id="notice-title"></h2>
          <p class="content-alert small-font" id="notice-message"></p>
        </div>
        <button
          type="button"
          class="notice-close"
          aria-label="Dismiss notification"
        >
          <i class="adx-ic_close" aria-hidden="true"></i>
        </button>
      </div>
    </aside>
    <script>
      "use strict";
      // This preview only uses local state: no API requests or credential storage.
      const form = document.querySelector("form");
      const submitButton = form.querySelector('[type="submit"]');
      const submitLabel = submitButton.querySelector(".btn-label");
      const originalLabel = submitLabel.textContent;
      const fieldset = form.querySelector("fieldset");
      const notice = document.querySelector(".notification");
      const params = new URLSearchParams(location.search);
      let busy = false;
      let noticeTimer;
      const delay = (milliseconds) =>
        new Promise((resolve) => setTimeout(resolve, milliseconds));
      function notify(type, title, message) {
        clearTimeout(noticeTimer);
        notice.querySelector(".alert").className = "alert " + type;
        notice.hidden = false;
        document.getElementById("notice-title").textContent = title;
        document.getElementById("notice-message").textContent = message;
        // Errors remain until corrected or dismissed; success also remains in form-status.
        if (type === "success")
          noticeTimer = setTimeout(() => {
            notice.hidden = true;
          }, 6000);
      }
      notice.querySelector(".notice-close").addEventListener("click", () => {
        notice.hidden = true;
        clearTimeout(noticeTimer);
      });
      function setBusy(value, label) {
        busy = value;
        fieldset.disabled = value;
        submitButton.disabled = value;
        form.setAttribute("aria-busy", String(value));
        submitLabel.textContent = value ? label : originalLabel;
        submitButton.querySelector(".sk-circle").hidden = !value;
      }
      function showFieldError(field, message) {
        const error = document.getElementById(field.id + "-error");
        field.setAttribute("aria-invalid", String(Boolean(message)));
        field.setCustomValidity(message);
        error.textContent = message;
        error.hidden = !message;
        return !message;
      }
      function validateField(field) {
        let message = "";
        const value =
          field.type === "password" || field.id === "password"
            ? field.value
            : field.value.trim();
        if (field.required && !value)
          message = "Please enter " + field.dataset.label + ".";
        else if (value && field.minLength > 0 && value.length < field.minLength)
          message = "Use at least " + field.minLength + " characters.";
        else if (field.maxLength > 0 && value.length > field.maxLength)
          message = "Use no more than " + field.maxLength + " characters.";
        else if (
          field.id === "email" &&
          value &&
          !/^[^@\s]+@[^@\s]+\.[a-zA-Z]{2,6}$/.test(value)
        )
          message = "Please enter a valid email address.";
        else if (field.id === "phone" && value && !/^[0-9]{7,15}$/.test(value))
          message = "Use 7–15 digits, without spaces or symbols.";
        return showFieldError(field, message);
      }
      const validatedFields = [...form.querySelectorAll("[data-label]")];
      validatedFields.forEach((field) => {
        field.addEventListener("blur", () => validateField(field));
        field.addEventListener("input", () => {
          document.getElementById("form-status").textContent = "";
          if (field.getAttribute("aria-invalid") === "true")
            validateField(field);
          else field.setCustomValidity("");
        });
      });
      function validateForm() {
        const invalid = validatedFields.filter(
          (field) => !validateField(field),
        );
        if (invalid.length) invalid[0].focus();
        return invalid.length === 0;
      }
      function clearValidation() {
        validatedFields.forEach((field) => {
          showFieldError(field, "");
          field.removeAttribute("aria-invalid");
        });
      }

      const password = document.getElementById("password");
      const passwordToggle = document.querySelector(".password-toggle");
      const demoButton = document.getElementById("fill-demo");
      const demoAccount = Object.freeze({
        email: "demo@metrics.test",
        password: "Metrics123!",
      });
      passwordToggle.addEventListener("click", () => {
        const show = password.type === "password";
        password.type = show ? "text" : "password";
        passwordToggle.setAttribute("aria-pressed", String(show));
        passwordToggle.setAttribute(
          "aria-label",
          show ? "Hide password" : "Show password",
        );
        passwordToggle.querySelector("i").className = show
          ? "icon-eye"
          : "icon-eye-blocked";
      });
      demoButton?.addEventListener("click", () => {
        document.getElementById("email").value = demoAccount.email;
        password.value = demoAccount.password;
        clearValidation();
        notice.hidden = true;
        document.getElementById("form-status").textContent = "";
        submitButton.focus();
      });
      // Only completed local previews are valid destinations for the simulated login.
      const destinations = new Map([
        ["index.html", "index.html"],
        ["/", "index.html"],
        ["Contact.html", "Contact.html"],
        ["/contact", "Contact.html"],
        ["/dashboard", "Dashboard/MeasurementReport.html"],
        ["Dashboard/Dashboard.html", "Dashboard/MeasurementReport.html"],
      ]);
      const destination =
        destinations.get(params.get("next")) ||
        "Dashboard/MeasurementReport.html";
      const demoNote = document.querySelector(".demo-account .form-demo-note");
      if (demoNote)
        demoNote.textContent =
          "Demo preview. A successful login opens " +
          (destination === "Contact.html"
            ? "Contact."
            : destination === "index.html"
              ? "Home."
              : "Measurement Report.");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (busy || !validateForm()) return;
        const emailValue = document
          .getElementById("email")
          .value.trim()
          .toLowerCase();
        const passwordValue = password.value;
        notice.hidden = true;
        document.getElementById("form-status").textContent = "";
        setBusy(true, "Logging in…");
        if (demoButton) demoButton.disabled = true;
        let navigating = false;
        try {
          await delay(700);
          if (
            emailValue !== demoAccount.email ||
            passwordValue !== demoAccount.password
          ) {
            notify(
              "danger",
              "Error",
              "Email or password is incorrect. Please try again.",
            );
          } else {
            form.reset();
            clearValidation();
            password.type = "password";
            passwordToggle.setAttribute("aria-label", "Show password");
            passwordToggle.setAttribute("aria-pressed", "false");
            passwordToggle.querySelector("i").className = "icon-eye-blocked";
            const status =
              "Demo login successful. Opening " +
              (destination === "Contact.html"
                ? "Contact…"
                : destination === "index.html"
                  ? "Home…"
                  : "Measurement Report…");
            document.getElementById("form-status").textContent = status;
            notify("success", "Success", status);
            await delay(1000);
            navigating = true;
            location.assign(destination);
          }
        } finally {
          if (!navigating) {
            setBusy(false);
            if (demoButton) demoButton.disabled = false;
            submitButton.focus({ preventScroll: true });
          }
        }
      });
      // Browsers may restore the page from their back/forward cache mid-navigation.
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          setBusy(false);
          if (demoButton) demoButton.disabled = false;
          document.getElementById("form-status").textContent = "";
          notice.hidden = true;
        }
      });
    </script>
  </body>
</html>
