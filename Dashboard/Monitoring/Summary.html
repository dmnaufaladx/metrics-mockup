<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Monitoring Summary — Metrics by ADX</title>
    <style>
      @font-face {
        font-family: Core;
        src: url("../../assets/fonts/Core/coresansc-45regular-webfont.woff2");
      }
      @font-face {
        font-family: Core;
        src: url("../../assets/fonts/Core/coresansc-65bold-webfont.woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: Adxfont;
        src: url("../../assets/fonts/icons/Adxfont.woff");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #262626;
        background: #f5f5fa;
        font:
          14px Core,
          Arial,
          sans-serif;
      }
      button,
      a {
        cursor: pointer;
        color: inherit;
      }
      button {
        font: inherit;
      }
      a {
        text-decoration: none;
      }
      [hidden] {
        display: none !important;
      }
      :focus-visible {
        outline: 3px solid #007aff;
        outline-offset: 3px;
      }
      .topbar {
        height: 62px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid #e5e5ea;
      }
      .logo img {
        height: 40px;
      }
      .brand-group,
      .account {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .account {
        position: relative;
      }
      .account button {
        border: 0;
        padding: 4px;
        background: white;
      }
      .adx-ic_user_circle {
        font-family: Adxfont;
        font-style: normal;
        font-size: 28px;
      }
      .adx-ic_user_circle:before {
        content: "\e94d";
      }
      .account-panel {
        position: absolute;
        right: 0;
        top: 40px;
        background: white;
        box-shadow: 0 2px 12px #0002;
        z-index: 5;
        min-width: 140px;
      }
      .account-panel a {
        display: block;
        padding: 16px;
      }
      .main {
        max-width: 1180px;
        margin: auto;
        padding: 40px 20px 80px;
      }
      h1 {
        font-size: 32px;
        margin: 0;
        letter-spacing: 1px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 24px;
      }
      hr {
        width: 37px;
        height: 4px;
        border: 0;
        background: #ff2d55;
        margin: 24px 0;
      }
      .details {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr 1fr;
        border-bottom: 1px solid #d5d5da;
        padding-bottom: 24px;
        gap: 24px;
      }
      .details div + div {
        border-left: 1px solid #d5d5da;
        padding-left: 32px;
      }
      .details dt {
        margin-bottom: 8px;
      }
      .details dd {
        margin: 0;
        font-weight: 700;
      }
      .overview {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 259px;
        margin-top: 48px;
      }
      .monitoring {
        padding-right: 32px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }
      .card {
        height: 108px;
        padding: 26px 20px;
        border-radius: 8px;
        box-shadow: 0 8px 16px #0000003d;
        color: white;
      }
      .card span {
        display: block;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .card strong {
        display: block;
        font-size: 20px;
        margin-top: 6px;
      }
      .normal {
        background-image: linear-gradient(to left, #7ae2bd, #07b48d);
      }
      .warning {
        background-image: linear-gradient(to left, #f8cf94, #ff9500);
      }
      .out {
        background-image: linear-gradient(to left, #fa889e, #ff2d55);
      }
      .table-wrap {
        margin-top: 42px;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      th {
        text-align: left;
        font-size: 13px;
        padding: 16px 24px;
      }
      th:last-child {
        width: 30%;
      }
      td {
        padding: 16px 24px;
      }
      tbody tr {
        height: 94px;
        background: white;
        box-shadow: 0 8px 16px #00000014;
      }
      tbody tr:hover {
        box-shadow: 0 4px 16px #d5d5da;
      }
      td button {
        border: 0;
        background: none;
        text-align: left;
        padding: 0;
        line-height: 1.6;
        font-size: 16px;
      }
      td button span {
        display: block;
      }
      .label {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .label.normal {
        color: #005642;
        background: #71ffcd;
      }
      .label.warning {
        color: #632700;
        background: #ffe7c4;
      }
      .label.out {
        color: #740000;
        background: #ffd0d9;
      }
      .status {
        border-left: 1px solid #d5d5da;
        align-self: start;
        padding-left: 16px;
      }
      .status h2 {
        font-size: 16px;
      }
      .progress-card {
        padding: 12px 16px;
        margin-bottom: 8px;
        background: white;
        box-shadow: 0 8px 16px #00000014;
        min-height: 72px;
      }
      .progress-card strong {
        font-size: 13px;
      }
      .progress-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .track {
        flex: 1;
        min-width: 0;
      }
      .bar {
        height: 16px;
        border-radius: 2px;
      }
      .progress-line span {
        font-weight: 700;
        font-size: 14px;
        white-space: nowrap;
      }
      .pagination {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }
      .pagination button {
        width: 36px;
        height: 36px;
        border: 1px solid #e5e5ea;
        background: white;
        border-radius: 4px;
      }
      .pagination button[aria-current] {
        background: #ff2d55;
        color: white;
      }
      .pagination button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .back {
        display: inline-block;
        margin-bottom: 20px;
        color: #777;
        font-size: 13px;
      }
      dialog {
        border: 0;
        border-radius: 8px;
        padding: 28px;
        width: min(480px, calc(100% - 32px));
        color: #262626;
        box-shadow: 0 8px 32px #0003;
      }
      dialog::backdrop {
        background: #0005;
      }
      dialog p {
        line-height: 1.7;
        white-space: pre-line;
      }
      dialog button {
        padding: 10px 20px;
        background: #ff2d55;
        border: 0;
        border-radius: 4px;
        color: white;
      }
      #count {
        font-size: 13px;
        color: #85858a;
      }
      @media (max-width: 1000px) {
        .overview {
          grid-template-columns: 1fr;
        }
        .monitoring {
          padding: 0;
        }
        .status {
          margin-top: 32px;
          border-left: 0;
          padding: 0;
        }
        .cards {
          gap: 12px;
        }
        .details {
          grid-template-columns: 1fr 1fr;
        }
        .details div + div {
          padding-left: 16px;
        }
      }
      @media (max-width: 600px) {
        .main {
          padding: 28px 16px;
        }
        .email {
          display: none;
        }
        h1 {
          font-size: 26px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 24px;
        }
        .details {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .details div + div {
          border: 0;
          padding: 0;
        }
        th,
        td {
          padding: 12px 8px;
        }
        td button {
          font-size: 14px;
        }
        .label {
          font-size: 11px;
          letter-spacing: 0;
        }
        .overview {
          margin-top: 32px;
        }
      }

      /* Shared report navigation follows HeaderDashboard and the supplied reference. */
      .topbar {
        height: 56px;
        position: relative;
        z-index: 10;
        padding: 0 max(20px, calc((100% - 1140px) / 2));
        gap: 20px;
      }
      .topbar .brand-group {
        gap: 0;
        min-width: 0;
        height: 100%;
      }
      .topbar .logo {
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .report-nav {
        position: relative;
        margin: 0 24px;
        padding: 8px 24px;
        border-left: 1px solid #d5d5da;
        border-right: 1px solid #d5d5da;
      }
      .report-nav-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        font-weight: 700;
        white-space: nowrap;
      }
      .nav-chevron {
        display: inline-flex;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #e5e5ea;
        align-items: center;
        justify-content: center;
      }
      .nav-chevron::before,
      .discovery-chevron::before {
        content: "";
        display: block;
        width: 8px;
        height: 8px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
      }
      [aria-expanded="true"] .nav-chevron::before,
      [aria-expanded="true"] .discovery-chevron::before {
        transform: translateY(2px) rotate(225deg);
      }
      .report-menu {
        position: absolute;
        top: calc(100% + 16px);
        left: 0;
        width: 280px;
        padding: 0 20px 20px;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        background: white;
        box-shadow: 0 0 8px #0000001a;
        max-height: calc(100dvh - 80px);
        overflow: auto;
        font-size: 18px;
        font-weight: 400;
      }
      .report-menu > a,
      .discovery-section {
        display: block;
        border-bottom: 1px solid #d5d5da;
      }
      .report-menu > a {
        padding: 20px 0;
      }
      .discovery-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        border: 0;
        padding: 20px 0;
        border-radius: 0;
        background: white;
        text-align: left;
        font-size: inherit;
        font-weight: 400;
      }
      .discovery-chevron {
        display: inline-flex;
      }
      .discovery-links {
        padding-bottom: 12px;
      }
      .discovery-links a {
        display: block;
        padding: 12px 20px;
      }
      .report-menu a:hover,
      .discovery-toggle:hover {
        color: #ff2d55;
      }
      .capture-tab {
        align-self: stretch;
        display: flex;
        align-items: center;
        white-space: nowrap;
        border-bottom: 2px solid #ff2d55;
        font-weight: 700;
      }
      .topbar .account {
        flex-shrink: 0;
        margin-left: auto;
      }
      @media (max-width: 767px) {
        .topbar {
          padding: 0 12px;
          gap: 8px;
          height: auto;
          min-height: 56px;
        }
        .topbar .logo img {
          height: 32px;
        }
        .report-nav {
          margin: 0 10px;
          padding: 8px 10px;
        }
        .report-nav-toggle {
          font-size: 13px;
        }
        .report-menu {
          position: fixed;
          top: 56px;
          left: 12px;
          width: min(280px, calc(100vw - 24px));
        }
        .topbar .brand-group {
          flex-wrap: wrap;
          padding: 8px 0;
        }
        .capture-tab {
          margin-left: 52px;
          padding: 10px 0 2px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-group">
        <a class="logo" href="../../Home.html"
          ><img
            src="../../assets/img/icons/metrics-ico-color.png"
            alt="Metrics by ADX — Home"
        /></a>
        <nav class="report-nav" aria-label="Report navigation">
          <button
            class="report-nav-toggle"
            id="report-nav-toggle"
            aria-expanded="false"
            aria-controls="report-menu"
          >
            Monitoring Report<span
              class="nav-chevron"
              aria-hidden="true"
            ></span>
          </button>
          <div class="report-menu" id="report-menu" hidden>
            <div class="discovery-section">
              <button
                class="discovery-toggle"
                id="header-discovery-toggle"
                aria-expanded="false"
                aria-controls="header-discovery-links"
              >
                Discovery Map<span
                  class="discovery-chevron"
                  aria-hidden="true"
                ></span>
              </button>
              <div class="discovery-links" id="header-discovery-links" hidden>
                <a href="../../SovMap/SovMap.html">Share of Voice</a>
                <a href="../../BillboardMap/BillboardMap.html">Insight Maps</a>
                <a href="../../Utility/KmlConverter.html">KML Converter</a>
              </div>
            </div>
            <a href="../Monitoring/ReportList.html">Monitoring Report</a>
            <a href="../MeasurementReport.html">Measurement Report</a>
            <a href="../../DownloadReport.html">Download Daily Report</a>
          </div>
        </nav>
      </div>
      <div class="account">
        <span class="email">demo@metrics.test</span
        ><button
          id="account-toggle"
          aria-label="Account"
          aria-expanded="false"
          aria-controls="account-panel"
        >
          <i class="adx-ic_user_circle" aria-hidden="true"></i>
        </button>
        <div class="account-panel" id="account-panel" hidden>
          <a href="../../Login.html">Sign Out</a>
        </div>
      </div>
    </header>
    <main class="main">
      <h1 id="title"></h1>
      <hr />
      <section id="summary">
        <dl class="details">
          <div>
            <dt>Period</dt>
            <dd id="period"></dd>
          </div>
          <div>
            <dt>Total Placement</dt>
            <dd id="total"></dd>
          </div>
          <div>
            <dt>Last Updated Date</dt>
            <dd id="updated"></dd>
          </div>
          <div>
            <dt>Last Update Placement</dt>
            <dd id="last"></dd>
          </div>
        </dl>
        <div class="overview">
          <section class="monitoring">
            <h2>MONITORING OVERVIEW</h2>
            <div class="cards" id="cards"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th scope="col">PLACEMENT</th>
                    <th scope="col">STATUS</th>
                  </tr>
                </thead>
                <tbody id="placements"></tbody>
              </table>
            </div>
            <nav
              class="pagination"
              id="pagination"
              aria-label="Placement pages"
            ></nav>
            <p id="count" role="status"></p>
          </section>
          <aside class="status">
            <h2>ALL TIME STATUS UPDATE</h2>
            <div id="progress"></div>
          </aside>
        </div>
      </section>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <h2 id="detail-title"></h2>
      <p id="detail-text"></p>
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <script>
      "use strict";
      const campaigns = [
        {
          id: 1,
          name: "LinkAja — Everyday Payments",
          brand: "LinkAja",
          start: "2026-01-01",
          end: "2026-03-31",
          updated: "2026-03-14",
          placement: "JKT001",
        },
        {
          id: 2,
          name: "Gojek — City Mobility",
          brand: "Gojek",
          start: "2026-02-01",
          end: "2026-04-30",
          updated: "2026-04-18",
          placement: "BDG021",
        },
        {
          id: 3,
          name: "Bhinneka — Business Essentials",
          brand: "Bhinneka",
          start: "2026-03-01",
          end: "2026-05-31",
          updated: "2026-05-16",
          placement: "SBY011",
        },
        {
          id: 4,
          name: "Safe Care — Everyday Comfort",
          brand: "Safe Care",
          start: "2026-04-01",
          end: "2026-06-30",
          updated: "2026-06-10",
          placement: "JKT024",
        },
        {
          id: 5,
          name: "LinkAja — Ramadan Campaign",
          brand: "LinkAja",
          start: "2026-02-15",
          end: "2026-03-31",
          updated: "2026-03-29",
          placement: "TGR008",
        },
        {
          id: 6,
          name: "Gojek — Jakarta Commute",
          brand: "Gojek",
          start: "2026-05-01",
          end: "2026-07-31",
          updated: "2026-07-22",
          placement: "JKT049",
        },
        {
          id: 7,
          name: "Bhinneka — Office Solutions",
          brand: "Bhinneka",
          start: "2026-06-01",
          end: "2026-08-31",
          updated: "2026-08-25",
          placement: "BKS012",
        },
        {
          id: 8,
          name: "Safe Care — Healthy Journey",
          brand: "Safe Care",
          start: "2026-07-01",
          end: "2026-09-30",
          updated: "2026-09-12",
          placement: "DPS006",
        },
        {
          id: 9,
          name: "LinkAja — Independence Day",
          brand: "LinkAja",
          start: "2026-08-01",
          end: "2026-08-31",
          updated: "2026-08-28",
          placement: "JKT068",
        },
        {
          id: 10,
          name: "Gojek — Back to Campus",
          brand: "Gojek",
          start: "2026-08-15",
          end: "2026-10-15",
          updated: "2026-09-09",
          placement: "YGY004",
        },
      ];
      const $ = (id) => document.getElementById(id);
      const campaign = campaigns.find(
        (c) =>
          c.id === Number(new URLSearchParams(location.search).get("id") || 1),
      );
      const format = (d) =>
        new Date(d + "T00:00:00").toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      const statuses = ["Normal", "Warning", "Out Of Service"],
        classes = ["normal", "warning", "out"];
      let page = 1;
      const pageSize = 5;
      const placements = campaign
        ? Array.from({ length: 12 }, (_, i) => ({
            id: campaign.id * 100 + i + 1,
            code:
              i === 0
                ? campaign.placement
                : "JKT" + String(campaign.id * 100 + i).padStart(3, "0"),
            side: i % 2 ? "B" : "A",
            address: [
              "Jl. Jend. Sudirman",
              "Jl. Gatot Subroto",
              "Jl. Rasuna Said",
            ][i % 3],
            city: "Jakarta",
            status:
              i === 11
                ? ""
                : statuses[
                    (i + campaign.id) % 5 === 0
                      ? 2
                      : (i + campaign.id) % 3 === 0
                        ? 1
                        : 0
                  ],
          }))
        : [];
      function showPlacement(item) {
        window.location.href =
          "Placement.html?id=" +
          encodeURIComponent(campaign.id) +
          "&placement=" +
          encodeURIComponent(item.id);
      }
      function render() {
        $("placements").replaceChildren(
          ...placements
            .slice((page - 1) * pageSize, page * pageSize)
            .map((item) => {
              const row = document.createElement("tr"),
                cell = document.createElement("td"),
                status = document.createElement("td"),
                button = document.createElement("button");
              button.innerHTML =
                "<span>" +
                item.code +
                item.side +
                "</span><span>" +
                item.address +
                ", " +
                item.city +
                "</span>";
              button.onclick = () => showPlacement(item);
              cell.append(button);
              if (item.status) {
                const label = document.createElement("span");
                label.className =
                  "label " + classes[statuses.indexOf(item.status)];
                label.textContent = item.status;
                status.append(label);
              } else status.textContent = "No Report";
              row.append(cell, status);
              row.onclick = (e) => {
                if (!e.target.closest("button")) showPlacement(item);
              };
              return row;
            }),
        );
        const max = Math.ceil(placements.length / pageSize);
        $("pagination").replaceChildren();
        for (let i = 0; i <= max + 1; i++) {
          const b = document.createElement("button"),
            target = i === 0 ? page - 1 : i === max + 1 ? page + 1 : i;
          b.textContent = i === 0 ? "‹" : i === max + 1 ? "›" : String(i);
          b.disabled = target < 1 || target > max;
          if (i === page) b.setAttribute("aria-current", "page");
          b.onclick = () => {
            page = target;
            render();
          };
          $("pagination").append(b);
        }
        $("count").textContent =
          "Showing " +
          ((page - 1) * pageSize + 1) +
          "–" +
          Math.min(page * pageSize, placements.length) +
          " of " +
          placements.length +
          " placements";
      }
      $("account-toggle").onclick = () => {
        const open = $("account-panel").hidden;
        $("account-panel").hidden = !open;
        $("account-toggle").setAttribute("aria-expanded", String(open));
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".account")) {
          $("account-panel").hidden = true;
          $("account-toggle").setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          $("account-panel").hidden = true;
          $("account-toggle").setAttribute("aria-expanded", "false");
        }
      });
      if (!campaign) {
        $("title").textContent = "Campaign not found";
        $("summary").hidden = true;
      } else {
        $("title").textContent = campaign.name;
        $("period").textContent =
          format(campaign.start) + " - " + format(campaign.end);
        $("total").textContent = placements.length + " items";
        $("updated").textContent = format(campaign.updated);
        $("last").textContent = campaign.placement;
        const counts = statuses.map(
          (status) => placements.filter((p) => p.status === status).length,
        );
        $("cards").innerHTML = statuses
          .map(
            (status, i) =>
              '<div class="card ' +
              classes[i] +
              '"><span>' +
              ["NORMAL", "WARNING", "OUT Of SERVICE"][i] +
              "</span><strong>" +
              counts[i] +
              " of " +
              placements.length +
              " Placement</strong></div>",
          )
          .join("");
        const updates = counts.map((n, i) => n * (4 + campaign.id) + i),
          total = updates.reduce((a, b) => a + b, 0);
        $("progress").innerHTML = statuses
          .map(
            (status, i) =>
              '<div class="progress-card"><strong>' +
              status +
              '</strong><div class="progress-line"><div class="track"><div class="bar ' +
              classes[i] +
              '" style="width:' +
              Math.round((updates[i] / total) * 100) +
              '%"></div></div><span>' +
              updates[i] +
              " Update</span></div></div>",
          )
          .join("");
        render();
      }

      (() => {
        const nav = document.querySelector(".report-nav");
        const toggle = document.getElementById("report-nav-toggle");
        const menu = document.getElementById("report-menu");
        const discovery = document.getElementById("header-discovery-toggle");
        const children = document.getElementById("header-discovery-links");
        function closeMenu(restoreFocus = false) {
          menu.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
          if (restoreFocus) toggle.focus();
        }
        toggle.onclick = () => {
          menu.hidden = !menu.hidden;
          toggle.setAttribute("aria-expanded", String(!menu.hidden));
          document.getElementById("account-panel").hidden = true;
          document
            .getElementById("account-toggle")
            .setAttribute("aria-expanded", "false");
        };
        discovery.onclick = () => {
          children.hidden = !children.hidden;
          discovery.setAttribute("aria-expanded", String(!children.hidden));
        };
        document.addEventListener("click", (event) => {
          if (!nav.contains(event.target)) closeMenu();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !menu.hidden) {
            closeMenu(true);
          }
        });
        nav.addEventListener("focusout", (event) => {
          if (event.relatedTarget && !nav.contains(event.relatedTarget))
            closeMenu();
        });
        const tab = document.querySelector(".capture-tab");
        if (tab) tab.href = "CaptureInsight.html" + location.search;
      })();
    </script>
  </body>
</html>
