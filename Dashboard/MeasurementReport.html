        background-color: #ffffff;
      }
      .measurement-report-list__wrapper
        .report-list
        .wrapper
        .table
        tbody
        .images {
        display: flex;
      }
      .measurement-report-list__wrapper
        .report-list
        .wrapper
        .table
        tbody
        .images
        img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        margin-right: 8px;
      }
      .measurement-report-list__wrapper .report-list .wrapper .table tbody td {
        padding: 16px 24px;

      .text-format {
        line-height: 1.25;

      .text-format-2 {
        line-height: 1.25;
        letter-spacing: normal;
      }

      .margin-format {
        margin-bottom: 4px;
      }
      /* Dashboard shell adapted from Dashboard and HeaderDashboard/SideBar SCSS. */
      body {
        margin: 0;
        color: #262626;
        background: #f5f5fa;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a {
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #007aff !important;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .topbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: white;
        border-bottom: 1px solid #e5e5ea;
        position: relative;
        z-index: 3;
      }
      .logo img {
        width: auto;
        height: 40px;
      }
      .account {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        font-size: 14px;
      }
      .account button {
        width: 40px;
        height: 40px;
        border-radius: 8px;
      }
      .account i {
        font-size: 28px;
      }
      .account-panel {
        position: absolute;
        right: 0;
        top: 46px;
        background: white;
        box-shadow: 0 2px 10px #0002;
        border: 1px solid #e5e5ea;

      }
      .account-panel a {

      }
      .account-panel a:hover {
        background: #f5f5fa;
      }
      .shell {
        display: flex;
        min-height: calc(100vh - 56px);
      }
      .sidebar {
        width: 300px;
        flex-shrink: 0;
        background-image: linear-gradient(to left, #fc2d2d, #fc2e90 70%);
        padding: 8px 0 24px 16px;
      }
      .sidebar nav > button {
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        width: 100%;
        padding: 16px;
        color: white;
        min-height: 52px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .sidebar .sidebar-link {
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        width: 100%;
        padding: 16px;
        color: white;
        min-height: 52px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .sidebar .sidebar-link img {
        width: 16px;
        height: 16px;
      }
      .sidebar nav > button img {
        width: 16px;
        height: 16px;
      }
      .sidebar button:hover,
      .submenu button:hover {
        background: #e5e5ea55;
      }
      .sidebar button.active {
        background-image: linear-gradient(to left, #32c5ff, #ff1c47 100%);
      }
      .chevron {
        margin-left: auto;
        transition: transform 0.2s;
      }
      .sidebar button[aria-expanded="true"] .chevron {
        transform: rotate(180deg);
      }
      .submenu {
        padding: 4px 16px 12px 24px;
      }
      .submenu a {
        display: block;
        color: white;
        padding: 12px;
        font-size: 14px;
      }
      .submenu a:hover {
        background: #e5e5ea55;
      }
      .submenu button {
        display: block;
        text-align: left;
        width: 100%;
        padding: 12px;
        color: white;
        font-size: 14px;
      }
      .content {
        flex: 1;
        min-width: 0;
        padding: 40px 30px;
      }
      .measurement-report-list .main {
        padding-bottom: 40px;
        min-height: 0 !important;
      }
      .measurement-report-list__wrapper .report-description .description {
        max-width: 800px;
        width: 100%;
      }
      .sort-search-report {
        gap: 20px;
      }
      .sort-search-report__left {
        max-width: 100%;
        align-items: center;
      }
      .sort-search-report input {
        font-size: 14px;
        min-width: 0;
        width: 100%;
      }
      #sort {
        background: white;
        border: 1px solid #e5e5ea;
        border-radius: 6px;
        padding: 10px 32px 10px 12px;
        font-size: 14px;
      }
      .table-scroll {
        overflow-x: auto;
        padding-bottom: 12px;
      }
      .table {
        min-width: 580px;
      }
      .campaign-link {
        text-align: left;
        padding: 0;
        line-height: 1.4;
      }
      .campaign-link:hover {
        text-decoration: underline;
        color: #d42548;
      }
      .period {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .owner {
        overflow-wrap: anywhere;
      }
      .empty {
        text-align: center !important;
        padding: 32px !important;
      }
      .pagination {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }
      .pagination button {
        width: 36px;
        height: 36px;
        background: white;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
      }
      .pagination button[aria-current] {
        background: #ff2d55;
        color: white;
        border-color: #ff2d55;
      }
      .pagination button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .result-count {
        font-size: 13px;
        color: #68686c;
        margin-top: 12px;
      }
      .mobile-nav {
        display: none;
      }
      .skip {
        position: absolute;
        top: -100px;
        left: 12px;
        background: white;
        padding: 12px;
        z-index: 10;
      }
      .skip:focus {
        top: 8px;
      }
      dialog {
        border: 0;
        border-radius: 8px;
        padding: 28px;
        width: min(480px, calc(100% - 32px));
        color: #262626;
        box-shadow: 0 8px 32px #0003;
      }
      dialog::backdrop {
        background: #0005;
      }
      dialog h2 {
        font-size: 22px;
        padding-right: 36px;
        margin-bottom: 20px;
      }
      dialog p {
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-line;
      }
      dialog .close {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 36px;
        height: 36px;
        border-radius: 4px;
        background: #f5f5fa;
      }
      @media (max-width: 1140px) {
        .sidebar {
          width: 250px;
        }
        .content {
          padding: 32px 24px;
        }
        .sort-search-report {
          flex-wrap: wrap;
        }
      }
      @media (max-width: 767px) {
        .topbar {
          padding: 0 12px;
        }
        .logo img {
          height: 32px;
        }
        .account .email {
          display: none;
        }
        .mobile-nav {
          display: block;
          width: 40px;
          height: 40px;
          font-size: 22px;
        }
        .brand-group {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .shell {
          display: block;
        }
        .sidebar {
          display: none;
          width: 100%;
          padding: 8px 16px;
        }
        .sidebar.open {
          display: block;
        }
        .content {
          padding: 28px 16px;
        }
        .sort-search-report__left {
          width: 100% !important;
        }
        .sort-search-report__right {
          width: 100%;
          justify-content: space-between;
        }
        .sort-search-report input {
          font-size: 16px;
        }
        .measurement-report-list__wrapper .report-list {
          margin-top: 24px;
        }
        h1.midlarge-title {
          font-size: 28px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">Skip to report</a>
    <header class="topbar">
      <div class="brand-group">
        <button
          class="mobile-nav"
          id="nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          ☰</button
        ><a class="logo" href="../Home.html"
          ><img
            src="../assets/img/icons/metrics-ico-color.png"
            alt="Metrics by ADX — Home"
        /></a>
      </div>
      <div class="account">
        <span class="email">demo@metrics.test</span
        ><button
          id="account-toggle"
          aria-label="Account"
          aria-expanded="false"
          aria-controls="account-panel"
        >
          <i class="adx-ic_user_circle" aria-hidden="true"></i>
        </button>
        <div class="account-panel" id="account-panel" hidden>
          <a href="../Login.html">Sign Out</a>
        </div>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <nav aria-label="Dashboard">
          <button
            id="discovery-toggle"
            aria-expanded="false"
            aria-controls="discovery-menu"
          >
            <img
              src="../assets/img/icons/adx-ic-location.png"
              alt=""
            />Discovery Map<i
              class="adx-ic_chevron_down chevron"
              aria-hidden="true"
            ></i>
          </button>
          <div class="submenu" id="discovery-menu" hidden>
            <a href="../SovMap/SovMap.html">Share of Voice</a>
            <a href="../BillboardMap/BillboardMap.html">Insight Maps</a
            ><a href="../Utility/KmlConverter.html">KML Converter</a>
          </div>
          <a class="sidebar-link" href="Monitoring/ReportList.html">
            <img
              src="../assets/img/icons/adx-ic-monitoring.png"
              alt=""
            />Monitoring Report
          </a>
          <button class="active" id="measurement-menu" aria-current="page">
            <img
              src="../assets/img/icons/adx-ic-measurement.png"
              alt=""
            />Measurement Report
          </button>
          <a class="sidebar-link" href="../DownloadReport.html">
            <img
              src="../assets/img/icons/adx-ic-monitoring.png"
              alt=""
            />Download Daily Report
          </a>
        </nav>
      </aside>
      <main class="content measurement-report-list" id="content" tabindex="-1">
        <div class="main">
          <div class="measurement-report-list__wrapper">
            <div class="report-title">
              <h1 class="text-format midlarge-title">Measurement Report</h1>
              <hr />
            </div>
            <div class="report-description">
              <div class="description">
                <span class="regular-font text-format"
                  >Just make sure all your campaign has get the 2 weeks report
                  monitoring, and make sure the campaign running
                  properlly.</span
                >
              </div>
            </div>
            <div class="sort-search-report">
              <div class="sort-search-report__left">
                <i class="adx-ic_search" aria-hidden="true"></i
                ><input
                  id="search"
                  type="search"
                  placeholder="Search Campaign or Brand"
                  aria-label="Search Campaign or Brand"
                />
              </div>
              <div class="sort-search-report__right">
                <label class="small-font" for="sort">Sort By :</label>
                <div class="placement-dropdown">
                  <select id="sort">
                    <option value="name">Name</option>
                    <option value="-created" selected>Last Added</option>
                    <option value="created">First Added</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="report-list">
              <div
                class="wrapper table-scroll"
                role="region"
                aria-label="Campaign reports"
                tabindex="0"
              >
                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col" class="campaign mini-font strong">
                        CAMPAIGN
                      </th>
                      <th scope="col" class="brand mini-font strong">
                        ADV. BRAND
                      </th>
                      <th scope="col" class="brand mini-font strong">OWNER</th>
                    </tr>
                  </thead>
                  <tbody id="reports"></tbody>
                </table>
              </div>
            </div>
            <nav
              class="pagination"
              id="pagination"
              aria-label="Report pages"
            ></nav>
            <p
              class="result-count"
              id="result-count"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>
      </main>
    </div>
    <dialog id="preview" aria-labelledby="preview-title">
      <button class="close" aria-label="Close preview">✕</button>
      <h2 id="preview-title"></h2>
      <p id="preview-description"></p>
    </dialog>
    <script>
      "use strict";
      // Dummy campaign records; no API or authentication is required for this preview.
      const campaigns = [
        {
          id: 1,
          name: "LinkAja — Everyday Payments",
          brand: "LinkAja",
          owner: "Nadia Putri",
          start: "2026-01-01",
          end: "2026-03-31",
        },
        {
          id: 2,
          name: "Gojek — City Mobility",
          brand: "Gojek",
          owner: "Rizky Pratama",
          start: "2026-02-01",
          end: "2026-04-30",
        },
        {
          id: 3,
          name: "Bhinneka — Business Essentials",
          brand: "Bhinneka",
          owner: "demo@metrics.test",
          start: "2026-03-01",
          end: "2026-05-31",
        },
        {
          id: 4,
          name: "Safe Care — Everyday Comfort",
          brand: "Safe Care",
          owner: "Nadia Putri",
          start: "2026-04-01",
          end: "2026-06-30",
        },
        {
          id: 5,
          name: "LinkAja — Ramadan Campaign",
          brand: "LinkAja",
          owner: "Rizky Pratama",
          start: "2026-02-15",
          end: "2026-03-31",
        },
        {
          id: 6,
          name: "Gojek — Jakarta Commute",
          brand: "Gojek",
          owner: "demo@metrics.test",
          start: "2026-05-01",
          end: "2026-07-31",
        },
        {
          id: 7,
          name: "Bhinneka — Office Solutions",
          brand: "Bhinneka",
          owner: "Nadia Putri",
          start: "2026-06-01",
          end: "2026-08-31",
        },
        {
          id: 8,
          name: "Safe Care — Healthy Journey",
          brand: "Safe Care",
          owner: "Rizky Pratama",
          start: "2026-07-01",
          end: "2026-09-30",
        },
        {
          id: 9,
          name: "LinkAja — Independence Day",
          brand: "LinkAja",
          owner: "demo@metrics.test",
          start: "2026-08-01",
          end: "2026-08-31",
        },
        {
          id: 10,
          name: "Gojek — Back to Campus",
          brand: "Gojek",
          owner: "Nadia Putri",
          start: "2026-08-15",
          end: "2026-10-15",
        },
        {
          id: 11,
          name: "Bhinneka — Business Growth",
          brand: "Bhinneka",
          owner: "Rizky Pratama",
          start: "2026-09-01",
          end: "2026-11-30",
        },
        {
          id: 12,
          name: "Safe Care — Family Weekend",
          brand: "Safe Care",
          owner: "demo@metrics.test",
          start: "2026-09-01",
          end: "2026-12-31",
        },
      ];
      const byId = (id) => document.getElementById(id),
        search = byId("search"),
        sort = byId("sort");
      let page = 1;
      const pageSize = 5;
      const date = (value) =>
        new Date(value + "T00:00:00").toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      const dialog = byId("preview");
      function preview(title, description) {
        byId("preview-title").textContent = title;
        byId("preview-description").textContent = description;
        dialog.showModal();
      }
      dialog.querySelector(".close").onclick = () => dialog.close();
      dialog.addEventListener("click", (e) => {
        if (e.target === dialog) {
          const r = dialog.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            dialog.close();
        }
      });
      function render() {
        const query = search.value.trim().toLowerCase();
        const list = campaigns
          .filter((c) => (c.name + " " + c.brand).toLowerCase().includes(query))
          .sort((a, b) =>
            sort.value === "name"
              ? a.name.localeCompare(b.name)
              : sort.value === "created"
                ? a.id - b.id
                : b.id - a.id,
          );
        const max = Math.max(1, Math.ceil(list.length / pageSize));
        page = Math.min(page, max);
        const rows = list
          .slice((page - 1) * pageSize, page * pageSize)
          .map((c) => {
            const row = document.createElement("tr"),
              campaign = document.createElement("td"),
              brand = document.createElement("td"),
              owner = document.createElement("td");
            const button = document.createElement("button");
            button.className = "campaign-link regular-font text-format";
            button.textContent = c.name;
            button.onclick = () => {
              window.location.href =
                "Measurement/CaptureInsight.html?id=" +
                encodeURIComponent(c.id);
            };
            const period = document.createElement("span");
            period.className = "period";
            period.textContent =
              "Period " + date(c.start) + " - " + date(c.end);
            campaign.append(button, period);
            brand.className = "small-font text-format";
            brand.textContent = c.brand;
            owner.className = "owner small-font text-format";
            owner.textContent = c.owner;
            row.append(campaign, brand, owner);
            return row;
          });
        if (!rows.length) {
          const row = document.createElement("tr"),
            cell = document.createElement("td");
          cell.colSpan = 3;
          cell.className = "empty";
          cell.textContent =
            "No campaigns found. Try another campaign or brand.";
          row.append(cell);
          rows.push(row);
        }
        byId("reports").replaceChildren(...rows);
        const buttons = [];
        function add(label, target, disabled = false, current = false) {
          const b = document.createElement("button");
          b.textContent = label;
          b.disabled = disabled;
          b.setAttribute(
            "aria-label",
            label === "‹"
              ? "Previous page"
              : label === "›"
                ? "Next page"
                : "Page " + label,
          );
          if (current) b.setAttribute("aria-current", "page");
          b.onclick = () => {
            page = target;
            render();
            const active = byId("pagination").querySelector("[aria-current]");
            if (active) active.focus();
          };
          buttons.push(b);
        }
        add("‹", page - 1, page === 1);
        for (let n = 1; n <= max; n++) add(String(n), n, false, n === page);
        add("›", page + 1, page === max);
        byId("pagination").replaceChildren(...buttons);
        byId("pagination").hidden = !list.length;
        byId("result-count").textContent = list.length
          ? "Showing " +
            ((page - 1) * pageSize + 1) +
            "–" +
            Math.min(page * pageSize, list.length) +
            " of " +
            list.length +
            " campaigns"
          : "0 campaigns";
      }
      search.addEventListener("input", () => {
        page = 1;
        render();
      });
      sort.addEventListener("change", () => {
        page = 1;
        render();
      });
      render();
      function toggle(button, panel) {
        const open = button.getAttribute("aria-expanded") !== "true";
        button.setAttribute("aria-expanded", String(open));
        panel.hidden = !open;
      }
      byId("discovery-toggle").onclick = () =>
        toggle(byId("discovery-toggle"), byId("discovery-menu"));
      byId("account-toggle").onclick = () =>
        toggle(byId("account-toggle"), byId("account-panel"));
      byId("nav-toggle").onclick = () => {
        const open =
          byId("nav-toggle").getAttribute("aria-expanded") !== "true";
        byId("nav-toggle").setAttribute("aria-expanded", String(open));
        byId("sidebar").classList.toggle("open", open);
      };
      document
        .querySelectorAll("[data-pending]")
        .forEach(
          (button) =>
            (button.onclick = () =>
              preview(
                button.dataset.pending,
                "This page is not available in this preview yet.",
              )),
        );
      byId("measurement-menu").onclick = () => {
        byId("sidebar").classList.remove("open");
        byId("nav-toggle").setAttribute("aria-expanded", "false");
        byId("content").focus();
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".account")) {
          byId("account-panel").hidden = true;
          byId("account-toggle").setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !dialog.open) {
          if (!byId("account-panel").hidden) byId("account-toggle").focus();
          else if (!byId("discovery-menu").hidden)
            byId("discovery-toggle").focus();
          byId("account-panel").hidden = true;
          byId("discovery-menu").hidden = true;
          byId("account-toggle").setAttribute("aria-expanded", "false");
          byId("discovery-toggle").setAttribute("aria-expanded", "false");
        }
      });
    </script>
  </body>
