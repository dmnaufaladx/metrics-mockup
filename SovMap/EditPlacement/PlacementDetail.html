<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Edit Placement — Placement Detail</title>
    <style>
      @font-face {
        font-family: Core;
        src: url("../../assets/fonts/Core/coresansc-45regular-webfont.woff2");
      }
      @font-face {
        font-family: Core;
        src: url("../../assets/fonts/Core/coresansc-65bold-webfont.woff2");
        font-weight: 700;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #262626;
        background: white;
        font:
          14px Core,
          Arial,
          sans-serif;
      }
      main {
        max-width: 584px;
        margin: auto;
        padding: 51px 0 77px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: white;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        padding: 12px 16px;
      }
      button:disabled {
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #32c5ff;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .tabs {
        display: flex;
        gap: 32px;
        padding-top: 24px;
        border-bottom: 1px solid #e5e5ea;
      }
      .tabs button {
        border: 0;
        border-radius: 0;
        padding: 0 0 21px;
        background: none;
        color: #999;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.81px;
      }
      .tabs .active {
        border-bottom: 2px solid #ff2d55;
        color: #262626;
      }
      .content {
        margin-top: 48px;
        border-bottom: 1px solid #e5e5ea;
      }
      .section-heading {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 24px;
      }
      .number {
        width: 24px;
        height: 24px;
        line-height: 24px;
        text-align: center;
        border-radius: 50%;
        background: linear-gradient(to left, #7ae2bd, #07b48d);
        color: white;
        box-shadow: 0 4px 8px #0003;
      }
      .section-heading h2 {
        font-size: 13px;
        letter-spacing: 1px;
        margin: 0;
      }
      .brand-row {
        display: flex;
        margin-bottom: 24px;
      }
      .brand-wrap {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      .brand-trigger {
        height: 48px;
        width: 100%;
        padding: 5px 16px;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand-trigger small {
        display: block;
        color: #999;
        font-size: 12px;
      }
      .brand-trigger:disabled {
        border-color: #f2f2f5;
        background: #f2f2f5;
        color: #999;
      }
      .chevron {
        width: 8px;
        height: 8px;
        border-right: 1.5px solid;
        border-bottom: 1.5px solid;
        transform: rotate(45deg);
        margin-right: 4px;
      }
      .brand-trigger[aria-expanded="true"] .chevron {
        transform: rotate(225deg);
      }
      .add-brand {
        width: 48px;
        height: 48px;
        padding: 0;
        font-size: 28px;
      }
      .add-brand:disabled {
        background: #e5e5ea;
        color: #878787;
      }
      .dropdown {
        position: absolute;
        top: 56px;
        width: 100%;
        z-index: 3;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        background: white;
        box-shadow: 0 0 4px #0003;
        padding: 24px;
      }
      .search {
        width: 100%;
        background: #fafafa;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        padding: 14px;
        margin-bottom: 24px;
      }
      .options {
        max-height: 200px;
        overflow: auto;
      }
      .options button {
        display: block;
        width: 100%;
        border: 0;
        text-align: left;
        padding: 8px 16px;
      }
      .options button:hover {
        background: #f5f5fa;
      }
      .message {
        display: block;
        position: relative;
        margin-bottom: 24px;
      }
      .message span {
        position: absolute;
        left: 16px;
        top: 8px;
        color: #999;
        font-size: 12px;
      }
      .message textarea {
        width: 100%;
        height: 130px;
        resize: none;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        padding: 26px 16px 12px;
      }
      .message textarea:disabled {
        background: #e5e5ea;
      }
      .images {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 40px;
      }
      .image-box {
        height: 85px;
        padding: 8px;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .image-box img {
        width: 65px;
        height: 65px;
        object-fit: cover;
        margin-left: auto;
      }
      .filename {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        font-size: 13px;
      }
      .remove {
        border: 0;
        padding: 0;
        font-size: 22px;
      }
      .upload-copy {
        font-size: 12px;
        flex: 1;
      }
      .upload-copy small {
        display: block;
        color: #999;
        font-size: 10px;
      }
      .open {
        padding: 6px 10px;
      }
      .empty-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 36px;
      }
      .empty-label input {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: #ff2d55;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        margin-bottom: 48px;
      }
      .actions button {
        font-weight: 700;
        font-size: 13px;
        padding: 16px;
        border-radius: 8px;
      }
      .primary {
        background: #ff2d55;
        color: white;
        border-color: #ff2d55;
      }
      #add-more {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #e5e5ea;
        color: #ff2d55;
        font-weight: 700;
      }
      dialog {
        border: 0;
        border-radius: 8px;
        padding: 24px;
        width: min(420px, calc(100% - 32px));
        box-shadow: 0 8px 30px #0003;
      }
      dialog::backdrop {
        background: #0005;
      }
      dialog h2 {
        font-size: 20px;
        margin: 0 0 20px;
      }
      dialog input {
        width: 100%;
        padding: 14px;
        border: 1px solid #e5e5ea;
        margin: 8px 0 20px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      #notice {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        background: #262626;
        color: white;
        border-radius: 6px;
        padding: 12px 20px;
        z-index: 6;
      }
      @media (max-width: 620px) {
        main {
          padding: 30px 16px;
        }
        .images {
          grid-template-columns: 1fr;
        }
        .tabs {
          gap: 24px;
        }
        .tabs button {
          font-size: 12px;
        }
        .dropdown {
          padding: 16px;
        }
      }

      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 16px;
        margin-top: 24px;
      }
      .field {
        position: relative;
        min-width: 0;
      }
      .field input,
      .field select {
        width: 100%;
        height: 56px;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        background: white;
        padding: 24px 16px 8px;
      }
      .field span {
        position: absolute;
        left: 16px;
        top: 8px;
        color: #999;
        font-size: 12px;
        pointer-events: none;
      }
      .field input:placeholder-shown:not(:focus) {
        padding: 16px;
      }
      .field input:placeholder-shown:not(:focus) + span {
        top: 20px;
        font-size: 14px;
      }
      .field input:disabled {
        background: #e5e5ea;
      }
      .field select {
        appearance: none;
        padding-right: 30px;
      }
      .field .chevron {
        position: absolute;
        right: 16px;
        top: 24px;
        pointer-events: none;
      }
      .route-button {
        width: 100%;
        height: 56px;
        text-align: left;
        padding: 24px 32px 8px 16px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .route-options {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background: white;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        padding: 16px;
        box-shadow: 0 2px 8px #0002;
        z-index: 5;
      }
      .route-options input {
        padding: 12px;
        height: 44px;
      }
      .route-options button {
        display: block;
        text-align: left;
        width: 100%;
        border: 0;
        padding: 10px 0;
      }
      .route-options #routes {
        max-height: 180px;
        overflow: auto;
      }
      .note {
        grid-column: 1/-1;
        margin: 0;
      }
      .note textarea {
        display: block;
      }
      .note textarea:placeholder-shown:not(:focus) + span {
        font-size: 14px;
        top: 16px;
      }
      .actions {
        margin: 24px 0 0;
      }
      .delete-location {
        margin-top: 59px;
        padding: 16px 8px 14px;
        text-align: center;
        border: 1px solid #e5e5ea;
        border-radius: 4px;
        background: #f5f5fa;
      }
      .delete-location h2 {
        font-size: 13px;
        text-transform: uppercase;
        margin: 0 0 8px;
      }
      .delete-location button {
        padding: 16px;
      }
      .tabs a {
        text-decoration: none;
        color: #999;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.81px;
        padding-bottom: 21px;
      }
      .tabs a.active {
        color: #262626;
      }
      #delete-dialog p {
        line-height: 1.6;
      }
      @media (max-width: 620px) {
        .fields {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .tabs a {
          font-size: 12px;
        }
        .actions button {
          padding: 14px 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Edit Placement</h1>
      <nav class="tabs" aria-label="Placement sections">
        <a id="content-tab" href="Content.html">ADVERTISING CONTENT</a
        ><a
          class="active"
          aria-current="page"
          id="detail-tab"
          href="PlacementDetail.html"
          >PLACEMENT DETAIL</a
        >
      </nav>
      <form id="placement-form">
        <div class="fields">
          <label class="field"
            ><input id="code" disabled value="JKT024" /><span>Code</span></label
          >
          <label class="field"
            ><select id="media">
              <option>Billboard</option>
              <option>Videotron</option>
              <option>Baliho</option>
              <option>Bando</option></select
            ><span>Media Type</span><i class="chevron"></i
          ></label>
          <label class="field"
            ><input
              id="latitude"
              type="number"
              step="any"
              min="-90"
              max="90"
              required
              value="-6.1074428"
            /><span>Latitude</span></label
          >
          <label class="field"
            ><input
              id="longitude"
              type="number"
              step="any"
              min="-180"
              max="180"
              required
              value="106.69381"
            /><span>Longitude</span></label
          >
          <label class="field"
            ><input id="owner" placeholder=" " /><span>Media Owner</span></label
          >
          <label class="field"
            ><input id="phone" type="tel" placeholder=" " /><span
              >Phone Number</span
            ></label
          >
          <label class="field"
            ><select id="road-side">
              <option>Left</option>
              <option>Right</option>
              <option>Middle</option></select
            ><span>Road Side</span><i class="chevron"></i
          ></label>
          <label class="field"
            ><input id="road-to" value="Tol dalam kota" placeholder=" " /><span
              >Road To</span
            ></label
          >
          <div class="field" id="route-field">
            <button
              type="button"
              id="route-button"
              class="route-button"
              aria-expanded="false"
              aria-label="Select Route"
            >
              Tol dalam kota - Tol Lingkar luar - Tol Bandara</button
            ><span>Select Route</span><i class="chevron"></i>
            <div class="route-options" id="route-options" hidden>
              <input
                id="route-search"
                type="search"
                placeholder="Search"
                aria-label="Search route"
              />
              <div id="routes"></div>
            </div>
          </div>
          <label class="field"
            ><input id="side" value="A" placeholder=" " /><span
              >Billboard Side</span
            ></label
          >
          <label class="message note">
            <textarea id="note" placeholder=" " aria-label="Note"></textarea
            ><span>Note</span></label
          >
        </div>
        <div class="actions">
          <button type="button" id="delete-placement">Delete Placement</button
          ><button class="primary" id="save">Save Placement</button>
        </div>
      </form>
      <section class="delete-location">
        <h2>Need to delete location for this placement ?</h2>
        <button id="delete-location">Delete Location</button>
      </section>
    </main>
    <dialog id="delete-dialog">
      <h2>Delete this Placement ?</h2>
      <p id="delete-message"></p>
      <p>Notes : this proccess can’t be undo</p>
      <div class="dialog-actions">
        <button id="cancel-delete">Cancel</button
        ><button class="primary" id="confirm-delete">Delete</button>
      </div>
    </dialog>
    <p id="notice" role="status" hidden></p>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        params = new URLSearchParams(location.search);
      const suffix = params.size ? "?" + params.toString() : "";
      $("content-tab").href = "Content.html" + suffix;
      $("detail-tab").href = "PlacementDetail.html" + suffix;
      const codes = ["JKT024", "JKT108", "BKS016", "TNG041", "DPK002"];
      if (params.has("id"))
        $("code").value = codes[Number(params.get("id")) - 1] || "JKT024";
      $("side").value = params.get("side") || "A";
      if (params.get("id") === "2") $("media").value = "Videotron";
      function notify(text) {
        $("notice").textContent = text;
        $("notice").hidden = false;
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => ($("notice").hidden = true), 3000);
      }
      const routeNames = [
        "Tol dalam kota - Tol Lingkar luar - Tol Bandara",
        "Jakarta - Bekasi",
        "Jakarta - Tangerang",
        "Depok - Bogor",
      ];
      function closeRoutes() {
        $("route-options").hidden = true;
        $("route-button").setAttribute("aria-expanded", "false");
      }
      function renderRoutes() {
        const names = routeNames.filter((n) =>
          n.toLowerCase().includes($("route-search").value.toLowerCase()),
        );
        $("routes").replaceChildren(
          ...names.map((name) => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = name;
            b.onclick = () => {
              $("route-button").textContent = name;
              closeRoutes();
              $("route-button").focus();
            };
            return b;
          }),
        );
        if (!names.length) $("routes").textContent = "No routes found.";
      }
      $("route-button").onclick = () => {
        const open = $("route-options").hidden;
        $("route-options").hidden = !open;
        $("route-button").setAttribute("aria-expanded", String(open));
        if (open) $("route-search").focus();
      };
      $("route-search").oninput = renderRoutes;
      renderRoutes();
      document.addEventListener("click", (e) => {
        if (!$("route-field").contains(e.target)) closeRoutes();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeRoutes();
      });
      $("placement-form").onsubmit = (e) => {
        e.preventDefault();
        const b = $("save");
        b.disabled = true;
        b.textContent = "Saving...";
        setTimeout(() => {
          b.disabled = false;
          b.textContent = "Save Placement";
          notify("Placement has been updated.");
        }, 300);
      };
      let deleteTarget = "placement";
      function askDelete(target) {
        deleteTarget = target;
        const code =
          $("code").value + (target === "placement" ? $("side").value : "");
        $("delete-message").textContent =
          "Are you sure want to delete this " +
          target +
          " with code " +
          code +
          " ?";
        $("delete-dialog").showModal();
      }
      $("delete-placement").onclick = () => askDelete("placement");
      $("delete-location").onclick = () => askDelete("sov");
      $("cancel-delete").onclick = () => $("delete-dialog").close();
      $("confirm-delete").onclick = () => {
        $("delete-dialog").close();
        notify(
          deleteTarget === "sov"
            ? "Location has been deleted."
            : "Placement has been deleted.",
        );
        setTimeout(() => (location.href = "../SovMap.html"), 350);
      };
    </script>
  </body>
</html>
